<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wall Tree Generator</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f27; font-family: system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      #info { position: fixed; left: 16px; bottom: 10px; color: #8b95a3; font-size: 12px; pointer-events: none; max-width: calc(100% - 32px); }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 23, 29, 0.78); color: #c9d1dc; z-index: 10; }
      #loading[hidden] { display: none; }
      #loading .box { width: min(340px, calc(100% - 48px)); }
      #loading h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
      #loading .track { height: 8px; border-radius: 4px; background: #343b48; overflow: hidden; }
      #loading .bar { height: 100%; width: 0; background: #c08a55; transition: width 0.12s linear; }
      #loading .meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #8b95a3; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="info"></div>
    <div id="loading" hidden>
      <div class="box">
        <h2 id="loading-title">Growing your tree</h2>
        <div class="track"><div class="bar" id="loading-bar"></div></div>
        <div class="meta"><span id="loading-label">Starting</span><span id="loading-pct">0%</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
